<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opus One — Virtual Tour</title>
<meta name="description" content="Walk through Opus One by GB Realty, New Chandigarh: choose a House on the towers, arrive through the lobby and move room to room.">
<meta name="theme-color" content="#0a1030">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230a1030'/%3E%3Cpath d='M12 4v16M7 20V9l5-5 5 5v11' fill='none' stroke='%23e3bb82' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="./assets/stills/tower.webp">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="./opus.css">
</head>
<body data-node="tower">

<main class="viewport" id="viewport">
  <div class="zoomer" id="zoomer">
    <div class="stage" id="stage">
      <img class="still" id="still" src="./assets/stills/tower.webp" alt="The Opus One towers at sunset, New Chandigarh">
      <canvas class="clip" id="seq" aria-hidden="true"></canvas>

      <svg class="layer floors houses" id="houses" viewBox="0 0 100 56.25" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="layer pins" id="pins"></div>
      <div class="floor-tip" id="houseTip" role="status"></div>
    </div>
  </div>
  <div class="shade" aria-hidden="true"></div>
</main>

<header class="top">
  <a class="brand" href="#tower" aria-label="Opus One, back to the towers">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2v20M6 22V8l6-6 6 6v14" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    <span>Opus One</span>
  </a>
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <span class="greeting" id="greeting" hidden></span>
</header>

<section class="intro" id="intro">
  <p class="eyebrow">GB Realty · New Chandigarh</p>
  <h1>Choose your House.<br>Walk straight in.</h1>
</section>

<section class="dock" id="dock" aria-label="Tour controls">
  <button class="back" id="back" type="button" aria-label="Go back">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
  <div class="caption">
    <span class="caption-kicker" id="kicker"></span>
    <strong class="caption-title" id="title"></strong>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Rooms"></div>
  <div class="specs" id="specs"></div>
</section>

<dialog class="plan" id="plan" aria-labelledby="planTitle">
  <div class="plan-head">
    <div>
      <span class="caption-kicker" id="planKicker"></span>
      <strong class="caption-title" id="planTitle"></strong>
    </div>
    <button class="plan-close" id="planClose" type="button" aria-label="Close floor plan">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </div>
  <div class="plan-units" id="planUnits" role="group" aria-label="Units"></div>
  <img class="plan-img" id="planImg" alt="">
  <p class="plan-areas" id="planAreas"></p>
</dialog>

<div class="progress" id="progress" aria-hidden="true"><i></i></div>
<noscript><p class="nojs">This virtual tour needs JavaScript.</p></noscript>

<script type="module" src="./tour.js"></script>
</body>
</html>
