<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Aurelle — Virtual Tour</title>
<meta name="description" content="Walk through The Aurelle: choose a floor on the tower, open the residence, and move room to room in one continuous shot.">
<meta name="theme-color" content="#0a1030">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230a1030'/%3E%3Cpath d='M12 4v16M7 20V9l5-5 5 5v11' fill='none' stroke='%23e3bb82' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="/assets/stills/tower.webp">
<link rel="stylesheet" href="style.css">
</head>
<body data-node="tower">

<main class="viewport" id="viewport">
  <div class="zoomer" id="zoomer">
    <div class="stage" id="stage">
      <img class="still" id="still" src="/assets/stills/tower.webp" alt="The Aurelle tower at blue hour, across the water">
      <video class="clip" id="clipA" muted playsinline preload="auto" aria-hidden="true"></video>
      <video class="clip" id="clipB" muted playsinline preload="auto" aria-hidden="true"></video>

      <svg class="layer floors" id="floors" viewBox="0 0 100 56.25" preserveAspectRatio="none" aria-hidden="true"></svg>
      <svg class="layer zones" id="zones" viewBox="0 0 1100 622" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="layer pins" id="pins"></div>
      <div class="floor-tip" id="floorTip" role="status"></div>
    </div>
  </div>
  <div class="shade" aria-hidden="true"></div>
</main>

<header class="top">
  <a class="brand" href="#tower" aria-label="The Aurelle, back to the tower">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2v20M6 22V8l6-6 6 6v14" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    <span>The Aurelle</span>
  </a>
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
</header>

<section class="intro" id="intro">
  <p class="eyebrow">Waterfront residences</p>
  <h1>Choose a floor.<br>Walk straight in.</h1>
</section>

<section class="dock" id="dock" aria-label="Tour controls">
  <button class="back" id="back" type="button" aria-label="Go back">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
  <div class="caption">
    <span class="caption-kicker" id="kicker"></span>
    <strong class="caption-title" id="title"></strong>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Rooms"></div>
  <div class="specs" id="specs"></div>
</section>

<div class="progress" id="progress" aria-hidden="true"><i></i></div>
<noscript><p class="nojs">This virtual tour needs JavaScript.</p></noscript>

<script type="module" src="/tour.js"></script>
</body>
</html>
